name: Update 2PIK VPN

on:

  push:

    paths:

      - "CitadelVPN/2PIK.txt"

      - "scripts/generate.py"

  workflow_dispatch:

permissions:

  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"

      - name: Generate subscriptions

        run: |

          python scripts/generate.py

      - name: Commit generated files

        run: |

          git config user.name "2PIK VPN Bot"

          git config user.email "actions@github.com"

          git add CitadelVPN/2PIK-base64.txt

          git add CitadelVPN/2PIK.json

          git diff --cached --quiet || git commit -m "Update 2PIK VPN subscription"

          git push
